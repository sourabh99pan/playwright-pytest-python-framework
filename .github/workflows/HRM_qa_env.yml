name: QA Automation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # 💡 1. Added Matrix Strategy to run browsers in parallel cloud environments
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false  # Prevents a failure in one browser from canceling the other runs

    env:
      ENV: qa

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Environment & Browser Variables
        run: |
          echo "ENV=$ENV"
          echo "Running on browser: ${{ matrix.browser }}"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps

      # 💡 2. Dynamic execution passing the active matrix browser parameter
      - name: Execute QA Tests
        run: |
          pytest --env=qa --browser=${{ matrix.browser }} --html=reports/report_${{ matrix.browser }}.html --self-contained-html

      # 💡 3. Dynamically names the artifact zip file so they don't overwrite each other
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Test-Report-${{ matrix.browser }}
          path: reports/
