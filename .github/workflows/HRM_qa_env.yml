name: QA Automation

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV: qa

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Environment Variable
        run: |
          echo "ENV=$ENV"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps

      # FIXED: Added explicit path directory matching your upload block
      - name: Execute QA Tests
        run: |
          pytest --env=qa --html=reports/report.html --self-contained-html

      # FIXED: Will now successfully find the reports/ folder created above
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Test-Report
          path: reports/
